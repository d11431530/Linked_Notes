<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>連動筆記</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="relative text-slate-800">

    <div class="absolute top-0 left-0 right-0 p-4 flex justify-between items-start pointer-events-none z-10">
        <div>
            <h1 class="text-2xl font-bold text-slate-800 drop-shadow-sm pointer-events-auto">連動筆記</h1>
            <p class="text-xs text-slate-500 mt-1 pointer-events-auto bg-white/80 p-1.5 rounded inline-block backdrop-blur-sm border border-slate-200">
                左鍵拖曳移動 • 滾輪縮放 • 右鍵修改 • 點兩下編輯
            </p>
        </div>
        <button id="reset-btn" class="pointer-events-auto bg-white hover:bg-slate-50 text-slate-600 text-sm py-1.5 px-3 rounded-md shadow-sm border border-slate-200 transition-colors">
            清除資料
        </button>
    </div>

    <div id="canvas-container" class="w-full h-full"></div>

    <div id="context-menu" class="hidden absolute bg-white/95 backdrop-blur-md border border-slate-200 shadow-xl rounded-lg py-1.5 min-w-[160px] text-sm z-50 transform transition-opacity duration-150">
        <div id="menu-node-options">
            <button class="w-full text-left px-4 py-2 hover:bg-slate-100 flex items-center text-blue-600" onclick="handleMenuAction('add-hub')">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                新增節點
            </button>
            <button class="w-full text-left px-4 py-2 hover:bg-slate-100 flex items-center text-emerald-600" onclick="handleMenuAction('add-note')">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                新增筆記
            </button>
            <div class="h-px bg-slate-200 my-1"></div>
            <button class="w-full text-left px-4 py-2 hover:bg-red-50 text-red-600 flex items-center" onclick="handleMenuAction('delete')">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                刪除
            </button>
        </div>
        <div id="menu-bg-options" class="hidden">
            <button class="w-full text-left px-4 py-2 hover:bg-slate-100 flex items-center text-blue-600" onclick="handleMenuAction('add-floating-hub')">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                新增中心
            </button>
        </div>
    </div>

    <div id="note-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl flex flex-col overflow-hidden transform transition-all scale-95 opacity-0" id="modal-content-box" style="max-height: 90vh;">
            
            <div class="border-b border-slate-100 bg-slate-50 px-6 py-4 flex justify-between items-center shrink-0">
                <div class="flex items-center gap-2 text-slate-500">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                    <span class="text-sm font-medium uppercase tracking-wider" id="modal-type-indicator">Edit Note</span>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <div class="p-6 flex-1 flex flex-col gap-4 overflow-y-auto">
                <input type="text" id="modal-title" placeholder="Node Title..." class="text-2xl font-bold text-slate-800 placeholder-slate-300 outline-none w-full bg-transparent border-b border-transparent focus:border-slate-200 pb-2 transition-colors shrink-0">
                
                <div class="shrink-0 bg-slate-50 p-3 rounded-lg border border-slate-100">
                    <label class="flex items-center justify-between cursor-pointer">
                        <span class="text-sm font-medium text-slate-600 flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            Attach Images
                        </span>
                        <input type="file" id="modal-image-upload" accept="image/*" multiple class="hidden">
                        <span class="bg-white border border-slate-200 text-xs px-3 py-1.5 rounded shadow-sm hover:bg-slate-50 text-slate-600 transition-colors">Choose Files</span>
                    </label>
                    
                    <div id="modal-image-preview-container" class="hidden mt-3 flex flex-wrap gap-3">
                        </div>
                </div>

                <textarea id="modal-body" placeholder="Start typing your notes here..." class="w-full h-48 resize-none outline-none text-slate-600 leading-relaxed bg-transparent flex-1 min-h-[12rem]"></textarea>
            </div>

            <div class="border-t border-slate-100 px-6 py-4 bg-slate-50 flex justify-end gap-3 shrink-0">
                <button onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-200 rounded-lg transition-colors">Cancel</button>
                <button onclick="saveModal()" class="px-6 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-sm transition-colors flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    Save Changes
                </button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
